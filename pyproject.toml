[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-bot"
version = "1.0.0"
description = "Institutional-grade automated Forex trading system"
requires-python = ">=3.11"
authors = [{ name = "Quant Dev" }]
license = { text = "Proprietary" }

dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "hmmlearn>=0.3",
    "redis>=5.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "prometheus-client>=0.20",
    "orjson>=3.9",
    "tenacity>=8.2",
    "circuitbreaker>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"